<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>福岡・九州 旅遊手帳</title>
<meta name="description" content="福岡/九州自由行旅遊手帳：行程、開支、實用連結、打包清單。可編輯、離線可用、一撳分享連結。">
<meta property="og:type" content="website">
<meta property="og:title" content="福岡・九州 旅遊手帳">
<meta property="og:description" content="行程 / 開支 / 連結 / 打包 — 可編輯、離線、分享連結跨裝置。">
<meta property="og:url" content="https://wical112.github.io/fukuoka-trip-2026/">
<meta property="og:image" content="https://wical112.github.io/fukuoka-trip-2026/icon.svg">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="福岡手帳">
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --panel2:#1e2530; --line:#2c3440;
    --txt:#eef1f6; --mut:#97a2b3; --mut2:#aeb6c6;
    --acc:#6f5fd6; --acc-a:#6256d2; --acc-b:#8463de;
    --spot:#4a8fe0; --move:#2eb583; --food:#ef8f4a; --stay:#c98be0; --fly:#e0a73a;
    --warn:#f0b860; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  body{min-height:100dvh}
  a{color:var(--acc-b)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
  header{position:sticky;top:0;z-index:50;background:rgba(14,17,23,.93);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 13px 8px}
  .htop{display:flex;align-items:center;gap:10px}
  .ttl{flex:1;min-width:0;font-size:16px;font-weight:800;border:0;background:transparent;
    color:var(--txt);font-family:inherit;padding:2px 0}
  .ttl[readonly]{pointer-events:none}
  .sub{font-size:11.5px;color:var(--mut);margin:3px 0 0}
  .mode{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    color:var(--mut2);font-weight:800;font-size:12px;border-radius:999px;
    padding:8px 13px;cursor:pointer;min-height:38px;font-family:inherit}
  .mode.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tabs{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;text-align:center;padding:9px 14px;border-radius:10px;
    font-weight:800;font-size:13px;background:var(--panel);color:var(--mut);
    border:1px solid var(--line);cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--panel2);color:var(--txt);border-color:var(--acc)}
  main{padding:13px 12px calc(34px + var(--safe-b))}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:12px 13px;margin:0 0 11px}
  .day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .dhead{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .ddate{font-size:12.5px;font-weight:800;color:var(--acc-b);white-space:nowrap}
  .today .ddate::after{content:"今日";margin-left:7px;background:var(--acc);color:#fff;
    font-size:10px;padding:2px 7px;border-radius:999px}
  .dttl{flex:1;font-size:15.5px;font-weight:800;background:transparent;border:0;
    color:var(--txt);font-family:inherit;min-width:0}
  .item{border-top:1px solid var(--line);padding:10px 0 2px;position:relative}
  .item:first-of-type{border-top:0}
  .item.done .iname{text-decoration:line-through;color:var(--mut)}
  .irow{display:flex;align-items:flex-start;gap:9px}
  .chk{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    background:var(--panel2);margin-top:2px;cursor:pointer;color:var(--move);
    font-weight:900;font-size:13px;line-height:19px;text-align:center;padding:0}
  .chk.on{background:var(--move);border-color:var(--move);color:#06281b}
  .ibody{flex:1;min-width:0}
  .iname{font-size:15px;font-weight:700;line-height:1.35}
  .ikind{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;
    margin-left:7px;vertical-align:middle;white-space:nowrap}
  .k-spot{background:rgba(74,143,224,.18);color:#8fbdf2}
  .k-move{background:rgba(46,181,131,.18);color:#5fd0a6}
  .k-food{background:rgba(239,143,74,.18);color:#f1ad7a}
  .k-stay{background:rgba(201,139,224,.18);color:#d6abe6}
  .k-fly{background:rgba(224,167,58,.2);color:#e7c074}
  .meta{font-size:12.5px;color:var(--mut2);margin:5px 0 0;line-height:1.55;white-space:pre-wrap}
  .meta b{color:#dfe4fb;font-weight:700}
  .cost{color:var(--warn);font-weight:800}
  .iacts{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 2px}
  .iacts a,.iacts button{flex:0 0 auto;border-radius:10px;padding:9px 12px;
    font-size:12.5px;font-weight:800;text-decoration:none;border:0;cursor:pointer;
    font-family:inherit;min-height:38px;display:inline-flex;align-items:center;gap:5px}
  .nav-a{background:linear-gradient(135deg,var(--acc-a),var(--acc-b));color:#fff}
  .nav-g{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  input,textarea,select{font-family:inherit}
  .fld{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:9px 10px;font-size:14px;margin:6px 0 0;outline:none}
  textarea.fld{min-height:54px;resize:vertical;line-height:1.5}
  .fgrid{display:flex;gap:7px;flex-wrap:wrap}
  .fgrid .fld{flex:1;min-width:88px}
  .ed-row{display:flex;gap:7px;align-items:center;margin-top:9px}
  .mini{border:1px solid var(--line);background:var(--panel2);color:var(--mut2);
    border-radius:8px;width:34px;height:34px;font-size:14px;cursor:pointer;
    font-weight:800;padding:0;flex:0 0 auto}
  .mini.del{color:#f3938f}
  .add{width:100%;background:transparent;border:1.5px dashed var(--line);
    color:var(--mut2);border-radius:11px;padding:11px;font-size:13px;font-weight:800;
    cursor:pointer;font-family:inherit;margin-top:4px}
  .add.big{margin:4px 0 26px;border-color:var(--acc);color:var(--acc-b)}
  .ln{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin:0 0 9px}
  .ln .lb{flex:1;min-width:0}
  .ln .lb a{font-weight:700;font-size:14.5px;word-break:break-all}
  .ln .lb .lu{font-size:11.5px;color:var(--mut);word-break:break-all;margin-top:2px}
  .pk{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .pk:last-child{border-bottom:0}
  .pk.on .pt{text-decoration:line-through;color:var(--mut)}
  .pt{flex:1;font-size:14.5px}
  .exp-sum{background:var(--panel2);border:1px solid var(--line);border-radius:13px;
    padding:13px;margin:0 0 12px;font-size:13px;line-height:1.7}
  .exp-sum .big{font-size:20px;font-weight:800;color:var(--txt)}
  .exp-sum .hkd{color:var(--warn);font-weight:800}
  .rate{width:84px!important;display:inline-block}
  .er{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;margin:0 0 9px}
  .er .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .er .ei{font-weight:700;font-size:14.5px}
  .er .ea{font-weight:800;color:var(--warn);white-space:nowrap}
  .er .em{font-size:11.5px;color:var(--mut);margin-top:2px}
  .bar{display:flex;gap:8px;margin:2px 2px 14px;flex-wrap:wrap}
  .bar button{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);
    color:var(--mut2);border-radius:11px;padding:11px;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit;min-height:44px}
  .bar button.pri{background:linear-gradient(135deg,var(--acc-a),var(--acc-b));
    color:#fff;border:0}
  .hint{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.7;
    padding:4px 14px 0}
  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));
    transform:translateX(-50%) translateY(20px);background:var(--acc);color:#fff;
    font-weight:800;font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;
    transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none!important}
  .empty{text-align:center;color:var(--mut);padding:38px 18px;font-size:14px;line-height:1.7}
  footer{color:#5a6275;font-size:11px;text-align:center;padding:8px 16px 0;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div style="flex:1;min-width:0">
      <input class="ttl" id="tripTtl" readonly aria-label="行程標題">
      <div class="sub" id="tripSub"></div>
    </div>
    <button class="mode" id="modeBtn" aria-label="切換編輯/檢視">👁 檢視</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="trip" aria-selected="true">🗺️ 行程</button>
    <button class="tab" data-tab="exp" aria-selected="false">💴 開支</button>
    <button class="tab" data-tab="link" aria-selected="false">🔗 連結</button>
    <button class="tab" data-tab="pack" aria-selected="false">🧳 打包</button>
  </div>
</header>

<main id="view"></main>

<footer>
  資料存喺你部裝置（localStorage）。改完用「🔗 分享連結」傳去其他裝置 / 備份。<br>
  <span id="meta"></span>
</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------- localStorage 防爆 ---------- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const KEY="fukuoka2026", EKEY="fukuoka2026_edit";

/* ---------- 種子資料（來自 Excel 行程截圖，可自由改）---------- */
function seed(){return {
  title:"福岡・九州 旅遊手帳",
  start:"2026-06-15", end:"2026-06-20",
  rate:0.052,                       // JPY → HKD（可改）
  days:[
   {date:"2026-06-15",title:"天神 / 博多",items:[
     {id:uid(),time:"",name:"博多丸井(0101)百貨 2樓",kind:"spot",
      loc:"博多マルイ 福岡市博多区博多駅中央街9-1",
      info:"交通：博多車站(博多口)\n營業：10:00–21:00，無定休\n（Excel 上一截，日子可自行調整）",
      cost:"",cur:"JPY",done:false}]},
   {date:"2026-06-16",title:"THE OUTLETS KITAKYUSHU 北九州",items:[
     {id:uid(),time:"",name:"THE OUTLETS KITAKYUSHU 北九州",kind:"spot",
      loc:"福岡県北九州市八幡東区東田4丁目1番1号",
      info:"交通：スペースワールド駅(太空世界站)步行5分鐘\n博多站可搭 JR『鹿兒島本線區間快速(門司港行)』一班直達\n營業：10:00~20:00（美食街、餐廳可能不同）",
      cost:"",cur:"JPY",done:false}]},
   {date:"2026-06-17",title:"由布院",items:[
     {id:uid(),time:"",name:"由布院",kind:"spot",loc:"由布院 大分県由布市湯布院町",
      info:"來往福岡交通：JR由布院之森/由布 約2hr15；高速巴士湯布院號 約2hr30(要預約)；或 博多車站3樓巴士",
      cost:"3000",cur:"JPY",done:false}]},
   {date:"2026-06-18",title:"太宰府",items:[
     {id:uid(),time:"",name:"太宰府天滿宮",kind:"spot",loc:"太宰府天満宮 福岡県太宰府市宰府4-7-1",
      info:"博多車站(3樓) 11號巴士 來回",cost:"1200",cur:"JPY",done:false}]},
   {date:"2026-06-19",title:"博多運河城",items:[
     {id:uid(),time:"",name:"博多運河城 Canal City Hakata",kind:"spot",
      loc:"キャナルシティ博多 福岡市博多区住吉1丁目2",info:"",cost:"",cur:"JPY",done:false}]},
   {date:"2026-06-20",title:"回港",items:[
     {id:uid(),time:"12:00",name:"前往機場",kind:"move",loc:"福岡空港 国際線ターミナル",
      info:"Go to Airport 12:00",cost:"",cur:"JPY",done:false},
     {id:uid(),time:"16:15–19:00",name:"HK Express 回港",kind:"fly",loc:"",
      info:"HK Express 20/06/2026 (Sat) 16:15–19:00",cost:"",cur:"JPY",done:false}]}
  ],
  exp:[],
  links:[
   {id:uid(),label:"HK Express 管理預訂",url:"https://www.hkexpress.com/"},
   {id:uid(),label:"福岡市交通局",url:"https://subway.city.fukuoka.lg.jp/"}
  ],
  pack:[
   {id:uid(),t:"護照 / 機票",d:false},{id:uid(),t:"日圓現金 + 信用卡",d:false},
   {id:uid(),t:"充電器 / 轉插 / 尿袋",d:false},{id:uid(),t:"雨具",d:false},
   {id:uid(),t:"常用藥物",d:false},{id:uid(),t:"網卡 / 漫遊",d:false}
  ]
};}

/* ---------- utils ---------- */
function uid(){return (crypto.randomUUID?crypto.randomUUID():
  "id"+Date.now()+Math.random().toString(16).slice(2,8));}
function esc(t){return (t==null?"":""+t).replace(/[&<>"]/g,m=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
const KIND={spot:"景點",move:"交通",food:"美食",stay:"住宿",fly:"航班"};
function todayISO(){const d=new Date();return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(iso){
  if(!iso)return"";const[y,m,d]=iso.split("-");
  const w=["日","一","二","三","四","五","六"][new Date(iso+"T00:00").getDay()];
  return `${+m}/${+d} (${w})`;
}
function mapA(q){return "https://maps.apple.com/?daddr="+encodeURIComponent(q);}
function mapG(q){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q);}

/* ---------- state ---------- */
let S, edit=false, tab="trip", saveT;
function load(){
  // URL 分享資料優先（#d=base64）
  if(location.hash.startsWith("#d=")){
    try{
      const j=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      if(j&&j.days){
        if(lsGet(KEY)&&!confirm("匯入分享嘅手帳？會覆蓋本機現有資料。"))
          {history.replaceState(null,"",location.pathname);}
        else { S=j; saveNow();
          history.replaceState(null,"",location.pathname);
          toast("已匯入分享嘅手帳"); return; }
      }
    }catch(e){ toast("分享連結資料讀唔到"); }
    history.replaceState(null,"",location.pathname);
  }
  const raw=lsGet(KEY);
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=seed(); } }
  else S=seed();
  // 補欄位
  S.rate=S.rate||0.052; S.exp=S.exp||[]; S.links=S.links||[]; S.pack=S.pack||[];
}
function saveNow(){ lsSet(KEY,JSON.stringify(S)); }
function save(){ clearTimeout(saveT); saveT=setTimeout(saveNow,250); }

/* path get/set：data-p="days|0|items|1|name" */
function setPath(p,val){
  const ks=p.split("|"); let o=S;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i];
    o=o[/^\d+$/.test(k)?+k:k]; }
  const last=ks[ks.length-1]; o[/^\d+$/.test(last)?+last:last]=val;
}

/* ---------- render ---------- */
const view=document.getElementById("view");
function render(){
  document.getElementById("tripTtl").value=S.title||"";
  document.getElementById("tripTtl").readOnly=!edit;
  document.getElementById("tripSub").textContent=
    (fmtDate(S.start)+" – "+fmtDate(S.end)).replace(/^ – | – $/,"");
  const mb=document.getElementById("modeBtn");
  mb.textContent=edit?"✏️ 編輯中":"👁 檢視";
  mb.classList.toggle("on",edit);
  [...document.getElementById("tabs").children].forEach(b=>
    b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  document.getElementById("meta").textContent=
    `${S.days.length} 日 · ${S.exp.length} 筆開支 · 更新 ${todayISO()}`;
  view.innerHTML =
    tab==="trip" ? viewTrip() :
    tab==="exp"  ? viewExp()  :
    tab==="link" ? viewLink() : viewPack();
  if(tab==="trip"){ const t=view.querySelector(".day.today");
    if(t) t.scrollIntoView({block:"center"}); }
}

function viewTrip(){
  const ti=todayISO();
  return S.days.map((d,di)=>{
    const today=d.date===ti;
    const items=d.items.map((it,ii)=>{
      const kc="k-"+it.kind;
      if(edit){
        const P=`days|${di}|items|${ii}`;
        return `<div class="item"><div class="fgrid">
          <input class="fld" data-p="${P}|time" value="${esc(it.time)}" placeholder="時間 (10:00)">
          <select class="fld" data-p="${P}|kind">${
            Object.keys(KIND).map(k=>`<option value="${k}"${k===it.kind?" selected":""}>${KIND[k]}</option>`).join("")}</select>
        </div>
        <input class="fld" data-p="${P}|name" value="${esc(it.name)}" placeholder="名稱">
        <input class="fld" data-p="${P}|loc" value="${esc(it.loc)}" placeholder="地址（地圖導航用）">
        <div class="fgrid">
          <input class="fld" data-p="${P}|cost" value="${esc(it.cost)}" placeholder="費用" inputmode="decimal">
          <input class="fld" data-p="${P}|cur" value="${esc(it.cur||'JPY')}" placeholder="幣別">
        </div>
        <textarea class="fld" data-p="${P}|info" placeholder="備註 / 交通 / 營業時間">${esc(it.info)}</textarea>
        <div class="ed-row">
          <button class="mini" data-act="iup" data-d="${di}" data-i="${ii}" aria-label="上移">▲</button>
          <button class="mini" data-act="idn" data-d="${di}" data-i="${ii}" aria-label="下移">▼</button>
          <button class="mini del" data-act="idel" data-d="${di}" data-i="${ii}" aria-label="刪除">✕</button>
        </div></div>`;
      }
      const acts=[];
      if(it.loc){
        acts.push(`<a class="nav-a" href="${mapA(it.loc)}">🧭 Apple 導航</a>`);
        acts.push(`<a class="nav-g" href="${mapG(it.loc)}" target="_blank" rel="noopener">Google</a>`);
      }
      return `<div class="item${it.done?' done':''}">
        <div class="irow">
          <button class="chk${it.done?' on':''}" data-act="itog" data-d="${di}" data-i="${ii}"
            aria-label="${it.done?'取消完成':'標記完成'}">${it.done?'✓':''}</button>
          <div class="ibody">
            <div class="iname">${it.time?`<b style="color:var(--acc-b)">${esc(it.time)}</b> `:""}${esc(it.name)}<span class="ikind ${kc}">${KIND[it.kind]||""}</span></div>
            ${it.cost?`<div class="meta"><span class="cost">${esc(it.cur||'JPY')} ${esc(it.cost)}</span></div>`:""}
            ${it.info?`<div class="meta">${esc(it.info)}</div>`:""}
            ${acts.length?`<div class="iacts">${acts.join("")}</div>`:""}
          </div>
        </div></div>`;
    }).join("");
    return `<div class="day${today?' today':''}">
      <div class="dhead">
        <span class="ddate">${esc(fmtDate(d.date))}</span>
        ${edit
          ? `<input class="dttl" data-p="days|${di}|title" value="${esc(d.title)}" placeholder="當日主題">`
          : `<span class="dttl">${esc(d.title)}</span>`}
      </div>
      ${edit?`<input class="fld" data-p="days|${di}|date" value="${esc(d.date)}" placeholder="YYYY-MM-DD" style="margin-bottom:4px">`:""}
      ${items||'<div class="empty" style="padding:18px">未有項目</div>'}
      ${edit?`<button class="add" data-act="iadd" data-d="${di}">＋ 加項目</button>
        <div class="ed-row"><button class="mini" data-act="dup" data-d="${di}" aria-label="日上移">▲</button>
        <button class="mini" data-act="ddn" data-d="${di}" aria-label="日下移">▼</button>
        <button class="mini del" data-act="ddel" data-d="${di}" aria-label="刪除此日">✕ 刪此日</button></div>`:""}
    </div>`;
  }).join("") +
  (edit?`<button class="add big" data-act="dadd">＋ 加一日</button>`:"") +
  shareBar();
}

function viewExp(){
  const byCur={};
  S.exp.forEach(e=>{const a=parseFloat(e.amount)||0;byCur[e.cur||'JPY']=(byCur[e.cur||'JPY']||0)+a;});
  const jpy=byCur.JPY||0, hkd=jpy*(S.rate||0.052);
  const others=Object.keys(byCur).filter(c=>c!=='JPY')
    .map(c=>`${c} ${byCur[c].toLocaleString()}`).join(" · ");
  const rows=S.exp.map((e,i)=>{
    if(edit){
      const P=`exp|${i}`;
      return `<div class="er"><div class="fgrid">
        <input class="fld" data-p="${P}|date" value="${esc(e.date)}" placeholder="日期">
        <input class="fld" data-p="${P}|cat" value="${esc(e.cat)}" placeholder="分類">
      </div><input class="fld" data-p="${P}|item" value="${esc(e.item)}" placeholder="項目">
      <div class="fgrid">
        <input class="fld" data-p="${P}|amount" value="${esc(e.amount)}" placeholder="金額" inputmode="decimal">
        <input class="fld" data-p="${P}|cur" value="${esc(e.cur||'JPY')}" placeholder="幣別">
      </div>
      <div class="ed-row"><button class="mini del" data-act="edel" data-i="${i}" aria-label="刪除">✕</button></div></div>`;
    }
    return `<div class="er"><div class="top">
      <span class="ei">${esc(e.item||'(未命名)')}</span>
      <span class="ea">${esc(e.cur||'JPY')} ${esc(e.amount||0)}</span></div>
      <div class="em">${esc(e.date||'')}${e.cat?' · '+esc(e.cat):''}</div></div>`;
  }).join("");
  return `<div class="exp-sum">
    JPY 小計 <span class="big">¥${jpy.toLocaleString()}</span><br>
    ≈ <span class="hkd">HK$${hkd.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
    <span style="color:var(--mut)">（匯率 1 JPY =
    ${edit?`<input class="fld rate" data-p="rate" value="${S.rate}" inputmode="decimal">`:S.rate}
    HKD）</span>${others?`<br><span style="color:var(--mut)">其他：${others}</span>`:""}
  </div>
  ${rows||'<div class="empty">未有開支記錄<br>切「✏️ 編輯」加第一筆</div>'}
  ${edit?`<button class="add big" data-act="eadd">＋ 加一筆開支</button>`:""}
  ${shareBar()}`;
}

function viewLink(){
  const rows=S.links.map((l,i)=>{
    if(edit) return `<div class="er">
      <input class="fld" data-p="links|${i}|label" value="${esc(l.label)}" placeholder="名稱">
      <input class="fld" data-p="links|${i}|url" value="${esc(l.url)}" placeholder="https://…">
      <div class="ed-row"><button class="mini del" data-act="ldel" data-i="${i}" aria-label="刪除">✕</button></div></div>`;
    return `<div class="ln"><div class="lb">
      <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a>
      <div class="lu">${esc(l.url)}</div></div></div>`;
  }).join("");
  return (rows||'<div class="empty">未有連結</div>')+
    (edit?`<button class="add big" data-act="ladd">＋ 加連結</button>`:"")+shareBar();
}

function viewPack(){
  const done=S.pack.filter(p=>p.d).length;
  const rows=S.pack.map((p,i)=>`<div class="pk${p.d?' on':''}">
    <button class="chk${p.d?' on':''}" data-act="ptog" data-i="${i}"
      aria-label="${p.d?'取消':'完成'}">${p.d?'✓':''}</button>
    ${edit?`<input class="pt fld" style="margin:0" data-p="pack|${i}|t" value="${esc(p.t)}">
      <button class="mini del" data-act="pdel" data-i="${i}" aria-label="刪除">✕</button>`
      :`<span class="pt">${esc(p.t)}</span>`}</div>`).join("");
  return `<div class="exp-sum">打包進度 <span class="big">${done}/${S.pack.length}</span></div>
    ${rows||'<div class="empty">清單空</div>'}
    ${edit?`<button class="add big" data-act="padd">＋ 加一項</button>`:""}${shareBar()}`;
}

function shareBar(){
  return `<div class="bar">
    <button class="pri" data-act="share">🔗 分享連結</button>
    <button data-act="exp-json">⬇ 匯出 JSON</button>
    <button data-act="imp-json">⬆ 匯入 JSON</button>
  </div><div class="hint">「分享連結」會複製一條含全部資料嘅網址 — 喺另一部裝置開就匯入。資料越多網址越長；想穩陣可同時用匯出 JSON 備份。</div>`;
}

/* ---------- toast ---------- */
let tT;
function toast(m){const e=document.getElementById("toast");e.textContent=m;
  e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),2200);}

/* ---------- share / export / import ---------- */
function shareLink(){
  try{
    const b=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const url=location.origin+location.pathname+"#d="+b;
    if(url.length>14000) toast("資料較多，連結偏長 — 建議改用匯出 JSON");
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
      .then(()=>toast("分享連結已複製 ✓"))
      .catch(()=>prompt("複製呢條連結：",url));
  }catch(e){ toast("產生連結失敗"); }
}
function expJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(S.title||"trip").replace(/\s+/g,"_")+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("已匯出 JSON");
}
function impJSON(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result);
      if(!j.days) throw 0;
      if(confirm("匯入呢個 JSON？會覆蓋本機現有資料。")){
        S=j; S.rate=S.rate||0.052; S.exp=S.exp||[]; S.links=S.links||[]; S.pack=S.pack||[];
        saveNow(); render(); toast("已匯入 JSON ✓"); }
    }catch(e){ toast("JSON 格式唔啱"); } };
    r.readAsText(f); };
  inp.click();
}

/* ---------- 事件委派 ---------- */
function mvArr(arr,i,dir){ const j=i+dir;
  if(j<0||j>=arr.length)return; [arr[i],arr[j]]=[arr[j],arr[i]]; }

view.addEventListener("input",e=>{
  const el=e.target.closest("[data-p]"); if(!el)return;
  let v=el.value;
  if(el.dataset.p==="rate") v=parseFloat(v)||0;
  setPath(el.dataset.p,v); save();
  if(el.dataset.p==="rate"||el.classList.contains("dttl")){} // 即時但唔重畫，免失焦
});
document.getElementById("tripTtl").addEventListener("input",e=>{
  S.title=e.target.value; save();
});

view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const a=b.dataset.act, di=+b.dataset.d, ii=+b.dataset.i;
  if(a==="share")    return shareLink();
  if(a==="exp-json") return expJSON();
  if(a==="imp-json") return impJSON();
  if(a==="itog"){ S.days[di].items[ii].done=!S.days[di].items[ii].done; save(); render(); return; }
  if(a==="ptog"){ S.pack[ii].d=!S.pack[ii].d; save(); render(); return; }
  if(!edit) return;
  if(a==="iadd") S.days[di].items.push({id:uid(),time:"",name:"",kind:"spot",loc:"",info:"",cost:"",cur:"JPY",done:false});
  else if(a==="idel"){ if(confirm("刪除呢個項目？")) S.days[di].items.splice(ii,1); else return; }
  else if(a==="iup") mvArr(S.days[di].items,ii,-1);
  else if(a==="idn") mvArr(S.days[di].items,ii,1);
  else if(a==="dadd") S.days.push({date:"",title:"",items:[]});
  else if(a==="ddel"){ if(confirm("刪除成日連項目？")) S.days.splice(di,1); else return; }
  else if(a==="dup") mvArr(S.days,di,-1);
  else if(a==="ddn") mvArr(S.days,di,1);
  else if(a==="eadd") S.exp.push({id:uid(),date:todayISO(),cat:"",item:"",amount:"",cur:"JPY"});
  else if(a==="edel"){ if(confirm("刪除呢筆開支？")) S.exp.splice(ii,1); else return; }
  else if(a==="ladd") S.links.push({id:uid(),label:"",url:""});
  else if(a==="ldel"){ if(confirm("刪除呢條連結？")) S.links.splice(ii,1); else return; }
  else if(a==="padd") S.pack.push({id:uid(),t:"",d:false});
  else if(a==="pdel"){ if(confirm("刪除呢項？")) S.pack.splice(ii,1); else return; }
  else return;
  save(); render();
});

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  tab=b.dataset.tab; render();
});
document.getElementById("modeBtn").addEventListener("click",()=>{
  edit=!edit; lsSet(EKEY,edit?"1":"0"); render();
});

/* ---------- init ---------- */
load();
edit=lsGet(EKEY)==="1";
render();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
