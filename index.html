<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>福岡・九州 旅遊手帳</title>
<meta name="description" content="福岡/九州自由行旅遊手帳：行程、開支、實用連結、打包清單。可編輯、離線可用、一撳分享連結。">
<meta property="og:type" content="website">
<meta property="og:title" content="福岡・九州 旅遊手帳">
<meta property="og:description" content="行程 / 開支 / 連結 / 打包 — 可編輯、離線、分享連結跨裝置。">
<meta property="og:url" content="https://wical112.github.io/fukuoka-trip-2026/">
<meta property="og:image" content="https://wical112.github.io/fukuoka-trip-2026/icon.svg">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="福岡手帳">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f5; --line:#dde2ea;
    --txt:#1a2230; --mut:#6b7488; --mut2:#49526a;
    --acc:#0f766e; --acc-a:#0e7e72; --acc-b:#13a394; --acc-soft:#d8efeb;
    --now:#ef6c2e; --now-soft:#fde7da;
    --spot:#2563c9; --move:#0f9d8e; --food:#e0762a; --stay:#9b59c9; --fly:#c98a16;
    --warn:#b9761b; --warn-soft:#fbeccf;
    --shadow:0 1px 3px rgba(20,30,55,.07),0 6px 16px rgba(20,30,55,.05);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0e1117; --panel:#161c26; --panel2:#1f2735; --line:#2d3645;
    --txt:#eef2f8; --mut:#8b95a8; --mut2:#aab3c6;
    --acc:#2bb7a6; --acc-a:#1f9e90; --acc-b:#37c9b6; --acc-soft:#15312e;
    --now:#f5824a; --now-soft:#3a2417;
    --spot:#6aa6f0; --move:#34c9b6; --food:#f0a460; --stay:#c79be6; --fly:#e3bd6a;
    --warn:#e7b15a; --warn-soft:#33291a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  body{min-height:100dvh}
  a{color:var(--acc)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
  header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 11px) 14px 0}
  .htop{display:flex;align-items:center;gap:10px;padding-bottom:9px}
  .ttl{flex:1;min-width:0;font-size:18px;font-weight:800;border:0;background:transparent;
    color:var(--txt);font-family:inherit;padding:2px 0;letter-spacing:.2px}
  .ttl[readonly]{pointer-events:none}
  .sub{font-size:11.5px;color:var(--mut);margin:2px 0 0;font-weight:600}
  .mode{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    color:var(--mut2);font-weight:800;font-size:12px;border-radius:999px;
    padding:9px 14px;cursor:pointer;min-height:40px;font-family:inherit;box-shadow:var(--shadow)}
  .mode.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .dstrip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
    padding:0 0 10px;margin:0 -2px}
  .dstrip::-webkit-scrollbar{display:none}
  .dpill{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    border-radius:13px;padding:7px 12px;cursor:pointer;text-align:center;
    font-family:inherit;line-height:1.25;min-width:52px}
  .dpill .dn{font-size:14px;font-weight:800;color:var(--txt)}
  .dpill .dw{font-size:10px;font-weight:700;color:var(--mut)}
  .dpill[aria-current="true"]{background:var(--acc);border-color:var(--acc)}
  .dpill[aria-current="true"] .dn,.dpill[aria-current="true"] .dw{color:#fff}
  .dpill.istoday{border-color:var(--now)}
  .dpill.istoday .dn{color:var(--now)}
  .dpill[aria-current="true"].istoday{background:var(--now);border-color:var(--now)}
  .dpill[aria-current="true"].istoday .dn{color:#fff}
  main{padding:14px 13px calc(86px + var(--safe-b))}
  .hero{background:linear-gradient(135deg,var(--acc),var(--acc-b));color:#fff;
    border-radius:18px;padding:15px 16px;margin:0 0 16px;box-shadow:var(--shadow)}
  .hero.pre{background:linear-gradient(135deg,#5b6b86,#7d8aa3)}
  .hero .hl{font-size:11.5px;font-weight:800;opacity:.85;letter-spacing:1px}
  .hero .ht{font-size:20px;font-weight:800;margin:3px 0 0}
  .hero .hn{font-size:13px;margin:9px 0 0;opacity:.95;line-height:1.5}
  .hero .hgo{display:inline-block;margin-top:11px;background:rgba(255,255,255,.22);
    color:#fff;border:0;font-weight:800;font-size:12.5px;padding:8px 15px;
    border-radius:999px;cursor:pointer;font-family:inherit}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:14px 15px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:128px}
  .day.today{border-color:var(--now)}
  .dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ddate{font-size:12px;font-weight:800;color:#fff;background:var(--acc);
    padding:4px 10px;border-radius:999px;white-space:nowrap}
  .today .ddate{background:var(--now)}
  .dttl{flex:1;font-size:17px;font-weight:800;background:transparent;border:0;
    color:var(--txt);font-family:inherit;min-width:0}
  /* timeline */
  .item{position:relative;padding:0 0 6px 64px;min-height:46px}
  .item::before{content:"";position:absolute;left:52px;top:7px;bottom:-6px;
    width:2px;background:var(--line)}
  .item:last-of-type::before{display:none}
  .item .tdot{position:absolute;left:46px;top:5px;width:14px;height:14px;
    border-radius:50%;background:var(--panel);border:3px solid var(--spot)}
  .item.k-move .tdot{border-color:var(--move)} .item.k-food .tdot{border-color:var(--food)}
  .item.k-stay .tdot{border-color:var(--stay)} .item.k-fly .tdot{border-color:var(--fly)}
  .item.done .tdot{background:var(--move);border-color:var(--move)}
  .item .ttime{position:absolute;left:0;top:2px;width:42px;text-align:right;
    font-size:12px;font-weight:800;color:var(--acc);line-height:1.2}
  .item.done .iname{text-decoration:line-through;color:var(--mut)}
  .irow{display:flex;align-items:flex-start;gap:9px}
  .chk{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--panel2);cursor:pointer;color:#fff;font-weight:900;font-size:13px;
    line-height:21px;text-align:center;padding:0}
  .chk.on{background:var(--move);border-color:var(--move)}
  .ibody{flex:1;min-width:0}
  .iname{font-size:15.5px;font-weight:700;line-height:1.35}
  .ikind{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;
    margin-left:8px;vertical-align:middle;white-space:nowrap}
  .k-spot .ikind{background:var(--acc-soft);color:var(--spot)}
  .k-move .ikind{background:color-mix(in srgb,var(--move) 16%,transparent);color:var(--move)}
  .k-food .ikind{background:color-mix(in srgb,var(--food) 18%,transparent);color:var(--food)}
  .k-stay .ikind{background:color-mix(in srgb,var(--stay) 16%,transparent);color:var(--stay)}
  .k-fly .ikind{background:color-mix(in srgb,var(--fly) 20%,transparent);color:var(--fly)}
  .meta{font-size:12.5px;color:var(--mut2);margin:5px 0 0;line-height:1.55;white-space:pre-wrap}
  .meta b{color:var(--txt);font-weight:700}
  .cost{color:var(--warn);font-weight:800;background:var(--warn-soft);
    padding:2px 8px;border-radius:999px;font-size:12px}
  .iacts{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 2px}
  .iacts a,.iacts button{flex:0 0 auto;border-radius:10px;padding:9px 13px;
    font-size:12.5px;font-weight:800;text-decoration:none;border:0;cursor:pointer;
    font-family:inherit;min-height:38px;display:inline-flex;align-items:center;gap:5px}
  .nav-a{background:var(--acc);color:#fff}
  .nav-g{background:var(--panel2);color:var(--mut2);border:1px solid var(--line)}
  input,textarea,select{font-family:inherit}
  .fld{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 11px;font-size:15px;margin:6px 0 0;outline:none}
  textarea.fld{min-height:56px;resize:vertical;line-height:1.5}
  .fgrid{display:flex;gap:7px;flex-wrap:wrap}
  .fgrid .fld{flex:1;min-width:90px}
  .ed-row{display:flex;gap:7px;align-items:center;margin-top:9px}
  .mini{border:1px solid var(--line);background:var(--panel2);color:var(--mut2);
    border-radius:9px;width:36px;height:36px;font-size:14px;cursor:pointer;
    font-weight:800;padding:0;flex:0 0 auto}
  .mini.del{color:#d6453f}
  .item.editing{padding-left:0}.item.editing::before,.item.editing .tdot,
  .item.editing .ttime{display:none}
  .add{width:100%;background:transparent;border:1.5px dashed var(--line);
    color:var(--mut2);border-radius:12px;padding:12px;font-size:13px;font-weight:800;
    cursor:pointer;font-family:inherit;margin-top:6px}
  .add.big{margin:4px 0 24px;border-color:var(--acc);color:var(--acc)}
  .ln{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:0 0 10px;
    box-shadow:var(--shadow)}
  .ln .lb{flex:1;min-width:0}
  .ln .lb a{font-weight:700;font-size:15px;word-break:break-all}
  .ln .lb .lu{font-size:11.5px;color:var(--mut);word-break:break-all;margin-top:2px}
  .pk{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .pk:last-child{border-bottom:0}
  .pk.on .pt{text-decoration:line-through;color:var(--mut)}
  .pt{flex:1;font-size:15px}
  .exp-sum{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:15px;margin:0 0 14px;font-size:13px;line-height:1.7;box-shadow:var(--shadow)}
  .exp-sum .big{font-size:24px;font-weight:800;color:var(--txt)}
  .exp-sum .hkd{color:var(--acc);font-weight:800}
  .rate{width:88px!important;display:inline-block}
  .er{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;margin:0 0 10px;box-shadow:var(--shadow)}
  .er .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .er .ei{font-weight:700;font-size:15px}
  .er .ea{font-weight:800;color:var(--warn);white-space:nowrap}
  .er .em{font-size:11.5px;color:var(--mut);margin-top:3px}
  .hint{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.7;
    padding:6px 14px 0}
  .bar{display:flex;gap:8px;margin:6px 2px 4px;flex-wrap:wrap}
  .bar button{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);
    color:var(--mut2);border-radius:12px;padding:12px;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit;min-height:44px;box-shadow:var(--shadow)}
  .bar button.pri{background:var(--acc);color:#fff;border:0}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
    background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:7px 8px calc(7px + var(--safe-b))}
  .bnav .tab{flex:1;background:transparent;border:0;color:var(--mut);
    font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;
    padding:7px 2px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;gap:3px;min-height:48px}
  .bnav .tab .ic{font-size:20px;line-height:1}
  .bnav .tab[aria-selected="true"]{color:var(--acc);background:var(--acc-soft)}
  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));
    transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);
    font-weight:800;font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;
    transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none!important}
  .empty{text-align:center;color:var(--mut);padding:40px 18px;font-size:14px;line-height:1.7}
  footer{color:var(--mut);font-size:11px;text-align:center;padding:6px 16px 0;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div style="flex:1;min-width:0">
      <input class="ttl" id="tripTtl" readonly aria-label="行程標題">
      <div class="sub" id="tripSub"></div>
    </div>
    <button class="mode" id="modeBtn" aria-label="切換編輯/檢視">👁 檢視</button>
  </div>
  <div class="dstrip" id="dstrip"></div>
</header>

<main id="view"></main>

<nav class="bnav" id="tabs" aria-label="分頁">
  <button class="tab" data-tab="trip" aria-selected="true"><span class="ic">🗺️</span>行程</button>
  <button class="tab" data-tab="exp" aria-selected="false"><span class="ic">💴</span>開支</button>
  <button class="tab" data-tab="link" aria-selected="false"><span class="ic">🔗</span>連結</button>
  <button class="tab" data-tab="pack" aria-selected="false"><span class="ic">🧳</span>打包</button>
</nav>

<footer>
  資料存喺你部裝置（localStorage）。改完用「🔗 分享連結」傳去其他裝置 / 備份。<br>
  <span id="meta"></span>
</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------- localStorage 防爆 ---------- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const KEY="fukuoka2026", EKEY="fukuoka2026_edit";

/* ---------- 種子資料（來自 Excel 行程截圖，可自由改）---------- */
function seed(){return {
  title:"福岡・九州 旅遊手帳",
  start:"2026-06-15", end:"2026-06-20",
  rate:0.052,                       // JPY → HKD（可改）
  days:[
   {date:"2026-06-15",title:"天神 / 博多",items:[
     {id:uid(),time:"",name:"博多丸井(0101)百貨 2樓",kind:"spot",
      loc:"博多マルイ 福岡市博多区博多駅中央街9-1",
      info:"交通：博多車站(博多口)\n營業：10:00–21:00，無定休\n（Excel 上一截，日子可自行調整）",
      cost:"",cur:"JPY",done:false}]},
   {date:"2026-06-16",title:"THE OUTLETS KITAKYUSHU 北九州",items:[
     {id:uid(),time:"",name:"THE OUTLETS KITAKYUSHU 北九州",kind:"spot",
      loc:"福岡県北九州市八幡東区東田4丁目1番1号",
      info:"交通：スペースワールド駅(太空世界站)步行5分鐘\n博多站可搭 JR『鹿兒島本線區間快速(門司港行)』一班直達\n營業：10:00~20:00（美食街、餐廳可能不同）",
      cost:"",cur:"JPY",done:false}]},
   {date:"2026-06-17",title:"由布院",items:[
     {id:uid(),time:"",name:"由布院",kind:"spot",loc:"由布院 大分県由布市湯布院町",
      info:"來往福岡交通：JR由布院之森/由布 約2hr15；高速巴士湯布院號 約2hr30(要預約)；或 博多車站3樓巴士",
      cost:"3000",cur:"JPY",done:false}]},
   {date:"2026-06-18",title:"太宰府",items:[
     {id:uid(),time:"",name:"太宰府天滿宮",kind:"spot",loc:"太宰府天満宮 福岡県太宰府市宰府4-7-1",
      info:"博多車站(3樓) 11號巴士 來回",cost:"1200",cur:"JPY",done:false}]},
   {date:"2026-06-19",title:"博多運河城",items:[
     {id:uid(),time:"",name:"博多運河城 Canal City Hakata",kind:"spot",
      loc:"キャナルシティ博多 福岡市博多区住吉1丁目2",info:"",cost:"",cur:"JPY",done:false}]},
   {date:"2026-06-20",title:"回港",items:[
     {id:uid(),time:"12:00",name:"前往機場",kind:"move",loc:"福岡空港 国際線ターミナル",
      info:"Go to Airport 12:00",cost:"",cur:"JPY",done:false},
     {id:uid(),time:"16:15–19:00",name:"HK Express 回港",kind:"fly",loc:"",
      info:"HK Express 20/06/2026 (Sat) 16:15–19:00",cost:"",cur:"JPY",done:false}]}
  ],
  exp:[],
  links:[
   {id:uid(),label:"HK Express 管理預訂",url:"https://www.hkexpress.com/"},
   {id:uid(),label:"福岡市交通局",url:"https://subway.city.fukuoka.lg.jp/"}
  ],
  pack:[
   {id:uid(),t:"護照 / 機票",d:false},{id:uid(),t:"日圓現金 + 信用卡",d:false},
   {id:uid(),t:"充電器 / 轉插 / 尿袋",d:false},{id:uid(),t:"雨具",d:false},
   {id:uid(),t:"常用藥物",d:false},{id:uid(),t:"網卡 / 漫遊",d:false}
  ]
};}

/* ---------- utils ---------- */
function uid(){return (crypto.randomUUID?crypto.randomUUID():
  "id"+Date.now()+Math.random().toString(16).slice(2,8));}
function esc(t){return (t==null?"":""+t).replace(/[&<>"]/g,m=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
const KIND={spot:"景點",move:"交通",food:"美食",stay:"住宿",fly:"航班"};
function todayISO(){const d=new Date();return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(iso){
  if(!iso)return"";const[y,m,d]=iso.split("-");
  const w=["日","一","二","三","四","五","六"][new Date(iso+"T00:00").getDay()];
  return `${+m}/${+d} (${w})`;
}
function mapA(q){return "https://maps.apple.com/?daddr="+encodeURIComponent(q);}
function mapG(q){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q);}

/* ---------- state ---------- */
let S, edit=false, tab="trip", saveT;
function load(){
  // URL 分享資料優先（#d=base64）
  if(location.hash.startsWith("#d=")){
    try{
      const j=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      if(j&&j.days){
        if(lsGet(KEY)&&!confirm("匯入分享嘅手帳？會覆蓋本機現有資料。"))
          {history.replaceState(null,"",location.pathname);}
        else { S=j; saveNow();
          history.replaceState(null,"",location.pathname);
          toast("已匯入分享嘅手帳"); return; }
      }
    }catch(e){ toast("分享連結資料讀唔到"); }
    history.replaceState(null,"",location.pathname);
  }
  const raw=lsGet(KEY);
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=seed(); } }
  else S=seed();
  // 補欄位
  S.rate=S.rate||0.052; S.exp=S.exp||[]; S.links=S.links||[]; S.pack=S.pack||[];
}
function saveNow(){ lsSet(KEY,JSON.stringify(S)); }
function save(){ clearTimeout(saveT); saveT=setTimeout(saveNow,250); }

/* path get/set：data-p="days|0|items|1|name" */
function setPath(p,val){
  const ks=p.split("|"); let o=S;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i];
    o=o[/^\d+$/.test(k)?+k:k]; }
  const last=ks[ks.length-1]; o[/^\d+$/.test(last)?+last:last]=val;
}

/* ---------- render ---------- */
const view=document.getElementById("view");
function render(){
  document.getElementById("tripTtl").value=S.title||"";
  document.getElementById("tripTtl").readOnly=!edit;
  document.getElementById("tripSub").textContent=
    (fmtDate(S.start)+" – "+fmtDate(S.end)).replace(/^ – | – $/,"");
  const mb=document.getElementById("modeBtn");
  mb.textContent=edit?"✏️ 編輯中":"👁 檢視";
  mb.classList.toggle("on",edit);
  [...document.getElementById("tabs").children].forEach(b=>
    b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  document.getElementById("meta").textContent=
    `${S.days.length} 日 · ${S.exp.length} 筆開支 · 更新 ${todayISO()}`;
  buildDStrip();
  view.innerHTML =
    tab==="trip" ? viewTrip() :
    tab==="exp"  ? viewExp()  :
    tab==="link" ? viewLink() : viewPack();
  if(tab==="trip" && wantScroll){
    wantScroll=false;
    const c=selDay>=0?selDay:tripDayIdx();
    const el=c>=0&&document.getElementById("day-"+c);
    if(el) requestAnimationFrame(()=>el.scrollIntoView({block:"start",behavior:"smooth"}));
  }
}
let wantScroll=true;

/* ---------- 日期條 ---------- */
let selDay=-1;
function tripDayIdx(){
  const ti=todayISO();
  let i=S.days.findIndex(d=>d.date===ti);
  if(i<0) i=S.days.findIndex(d=>d.date&&d.date>=ti);   // 下一個
  return i;
}
function buildDStrip(){
  const ds=document.getElementById("dstrip");
  ds.classList.toggle("hide",tab!=="trip");
  if(tab!=="trip") return;
  const ti=todayISO(), cur=selDay>=0?selDay:Math.max(0,tripDayIdx());
  ds.innerHTML=S.days.map((d,i)=>{
    const [,m,dd]=(d.date||"--").split("-");
    const w=d.date?["日","一","二","三","四","五","六"][new Date(d.date+"T00:00").getDay()]:"";
    return `<button class="dpill${d.date===ti?' istoday':''}" data-day="${i}"
      aria-current="${i===cur}">
      <div class="dn">${m?+m+"/"+ +dd:"D"+(i+1)}</div><div class="dw">${w?"週"+w:""}</div></button>`;
  }).join("");
}

function viewTrip(){
  const ti=todayISO();
  const days=S.days.map((d,di)=>{
    const today=d.date===ti;
    const items=d.items.map((it,ii)=>{
      const kc="k-"+it.kind;
      if(edit){
        const P=`days|${di}|items|${ii}`;
        return `<div class="item editing"><div class="fgrid">
          <input class="fld" data-p="${P}|time" value="${esc(it.time)}" placeholder="時間 (10:00)">
          <select class="fld" data-p="${P}|kind">${
            Object.keys(KIND).map(k=>`<option value="${k}"${k===it.kind?" selected":""}>${KIND[k]}</option>`).join("")}</select>
        </div>
        <input class="fld" data-p="${P}|name" value="${esc(it.name)}" placeholder="名稱">
        <input class="fld" data-p="${P}|loc" value="${esc(it.loc)}" placeholder="地址（地圖導航用）">
        <div class="fgrid">
          <input class="fld" data-p="${P}|cost" value="${esc(it.cost)}" placeholder="費用" inputmode="decimal">
          <input class="fld" data-p="${P}|cur" value="${esc(it.cur||'JPY')}" placeholder="幣別">
        </div>
        <textarea class="fld" data-p="${P}|info" placeholder="備註 / 交通 / 營業時間">${esc(it.info)}</textarea>
        <div class="ed-row">
          <button class="mini" data-act="iup" data-d="${di}" data-i="${ii}" aria-label="上移">▲</button>
          <button class="mini" data-act="idn" data-d="${di}" data-i="${ii}" aria-label="下移">▼</button>
          <button class="mini del" data-act="idel" data-d="${di}" data-i="${ii}" aria-label="刪除">✕</button>
        </div></div>`;
      }
      const acts=[];
      if(it.loc){
        acts.push(`<a class="nav-a" href="${mapA(it.loc)}">🧭 Apple 導航</a>`);
        acts.push(`<a class="nav-g" href="${mapG(it.loc)}" target="_blank" rel="noopener">Google</a>`);
      }
      return `<div class="item k-${it.kind}${it.done?' done':''}">
        <span class="ttime">${esc(it.time||"")}</span><span class="tdot"></span>
        <div class="irow">
          <button class="chk${it.done?' on':''}" data-act="itog" data-d="${di}" data-i="${ii}"
            aria-label="${it.done?'取消完成':'標記完成'}">${it.done?'✓':''}</button>
          <div class="ibody">
            <div class="iname">${esc(it.name)}<span class="ikind">${KIND[it.kind]||""}</span></div>
            ${it.cost?`<div class="meta"><span class="cost">${esc(it.cur||'JPY')} ${esc(it.cost)}</span></div>`:""}
            ${it.info?`<div class="meta">${esc(it.info)}</div>`:""}
            ${acts.length?`<div class="iacts">${acts.join("")}</div>`:""}
          </div>
        </div></div>`;
    }).join("");
    return `<div class="day${today?' today':''}" id="day-${di}">
      <div class="dhead">
        <span class="ddate">${esc(fmtDate(d.date))}</span>
        ${edit
          ? `<input class="dttl" data-p="days|${di}|title" value="${esc(d.title)}" placeholder="當日主題">`
          : `<span class="dttl">${esc(d.title)}</span>`}
      </div>
      ${edit?`<input class="fld" data-p="days|${di}|date" value="${esc(d.date)}" placeholder="YYYY-MM-DD" style="margin-bottom:8px">`:""}
      ${items||'<div class="empty" style="padding:18px">未有項目</div>'}
      ${edit?`<button class="add" data-act="iadd" data-d="${di}">＋ 加項目</button>
        <div class="ed-row"><button class="mini" data-act="dup" data-d="${di}" aria-label="日上移">▲</button>
        <button class="mini" data-act="ddn" data-d="${di}" aria-label="日下移">▼</button>
        <button class="mini del" data-act="ddel" data-d="${di}" aria-label="刪除此日">✕ 刪此日</button></div>`:""}
    </div>`;
  }).join("");
  return heroHTML() + days +
    (edit?`<button class="add big" data-act="dadd">＋ 加一日</button>`:"") +
    shareBar();
}

function heroHTML(){
  if(edit||!S.days.length) return "";
  const ti=todayISO(), idx=tripDayIdx();
  if(idx<0) return `<div class="hero pre"><div class="hl">旅程</div>
    <div class="ht">行程已結束 ✦ 旅途愉快</div></div>`;
  const d=S.days[idx], isToday=d.date===ti;
  const nx=d.items.find(it=>!it.done)||d.items[0];
  const nstr=nx?`${nx.time?esc(nx.time)+" · ":""}${esc(nx.name)}`:"未排項目";
  return `<div class="hero${isToday?'':' pre'}">
    <div class="hl">${isToday?"今日 "+esc(fmtDate(d.date)):"下一站 "+esc(fmtDate(d.date))}</div>
    <div class="ht">${esc(d.title||"（未命名）")}</div>
    <div class="hn">📍 ${nstr}</div>
    <button class="hgo" data-go="${idx}">睇呢日 ↓</button></div>`;
}

function viewExp(){
  const byCur={};
  S.exp.forEach(e=>{const a=parseFloat(e.amount)||0;byCur[e.cur||'JPY']=(byCur[e.cur||'JPY']||0)+a;});
  const jpy=byCur.JPY||0, hkd=jpy*(S.rate||0.052);
  const others=Object.keys(byCur).filter(c=>c!=='JPY')
    .map(c=>`${c} ${byCur[c].toLocaleString()}`).join(" · ");
  const rows=S.exp.map((e,i)=>{
    if(edit){
      const P=`exp|${i}`;
      return `<div class="er"><div class="fgrid">
        <input class="fld" data-p="${P}|date" value="${esc(e.date)}" placeholder="日期">
        <input class="fld" data-p="${P}|cat" value="${esc(e.cat)}" placeholder="分類">
      </div><input class="fld" data-p="${P}|item" value="${esc(e.item)}" placeholder="項目">
      <div class="fgrid">
        <input class="fld" data-p="${P}|amount" value="${esc(e.amount)}" placeholder="金額" inputmode="decimal">
        <input class="fld" data-p="${P}|cur" value="${esc(e.cur||'JPY')}" placeholder="幣別">
      </div>
      <div class="ed-row"><button class="mini del" data-act="edel" data-i="${i}" aria-label="刪除">✕</button></div></div>`;
    }
    return `<div class="er"><div class="top">
      <span class="ei">${esc(e.item||'(未命名)')}</span>
      <span class="ea">${esc(e.cur||'JPY')} ${esc(e.amount||0)}</span></div>
      <div class="em">${esc(e.date||'')}${e.cat?' · '+esc(e.cat):''}</div></div>`;
  }).join("");
  return `<div class="exp-sum">
    JPY 小計 <span class="big">¥${jpy.toLocaleString()}</span><br>
    ≈ <span class="hkd">HK$${hkd.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
    <span style="color:var(--mut)">（匯率 1 JPY =
    ${edit?`<input class="fld rate" data-p="rate" value="${S.rate}" inputmode="decimal">`:S.rate}
    HKD）</span>${others?`<br><span style="color:var(--mut)">其他：${others}</span>`:""}
  </div>
  ${rows||'<div class="empty">未有開支記錄<br>切「✏️ 編輯」加第一筆</div>'}
  ${edit?`<button class="add big" data-act="eadd">＋ 加一筆開支</button>`:""}
  ${shareBar()}`;
}

function viewLink(){
  const rows=S.links.map((l,i)=>{
    if(edit) return `<div class="er">
      <input class="fld" data-p="links|${i}|label" value="${esc(l.label)}" placeholder="名稱">
      <input class="fld" data-p="links|${i}|url" value="${esc(l.url)}" placeholder="https://…">
      <div class="ed-row"><button class="mini del" data-act="ldel" data-i="${i}" aria-label="刪除">✕</button></div></div>`;
    return `<div class="ln"><div class="lb">
      <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a>
      <div class="lu">${esc(l.url)}</div></div></div>`;
  }).join("");
  return (rows||'<div class="empty">未有連結</div>')+
    (edit?`<button class="add big" data-act="ladd">＋ 加連結</button>`:"")+shareBar();
}

function viewPack(){
  const done=S.pack.filter(p=>p.d).length;
  const rows=S.pack.map((p,i)=>`<div class="pk${p.d?' on':''}">
    <button class="chk${p.d?' on':''}" data-act="ptog" data-i="${i}"
      aria-label="${p.d?'取消':'完成'}">${p.d?'✓':''}</button>
    ${edit?`<input class="pt fld" style="margin:0" data-p="pack|${i}|t" value="${esc(p.t)}">
      <button class="mini del" data-act="pdel" data-i="${i}" aria-label="刪除">✕</button>`
      :`<span class="pt">${esc(p.t)}</span>`}</div>`).join("");
  return `<div class="exp-sum">打包進度 <span class="big">${done}/${S.pack.length}</span></div>
    ${rows||'<div class="empty">清單空</div>'}
    ${edit?`<button class="add big" data-act="padd">＋ 加一項</button>`:""}${shareBar()}`;
}

function shareBar(){
  return `<div class="bar">
    <button class="pri" data-act="share">🔗 分享連結</button>
    <button data-act="exp-json">⬇ 匯出 JSON</button>
    <button data-act="imp-json">⬆ 匯入 JSON</button>
  </div><div class="hint">「分享連結」會複製一條含全部資料嘅網址 — 喺另一部裝置開就匯入。資料越多網址越長；想穩陣可同時用匯出 JSON 備份。</div>`;
}

/* ---------- toast ---------- */
let tT;
function toast(m){const e=document.getElementById("toast");e.textContent=m;
  e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),2200);}

/* ---------- share / export / import ---------- */
function shareLink(){
  try{
    const b=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const url=location.origin+location.pathname+"#d="+b;
    if(url.length>14000) toast("資料較多，連結偏長 — 建議改用匯出 JSON");
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
      .then(()=>toast("分享連結已複製 ✓"))
      .catch(()=>prompt("複製呢條連結：",url));
  }catch(e){ toast("產生連結失敗"); }
}
function expJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(S.title||"trip").replace(/\s+/g,"_")+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("已匯出 JSON");
}
function impJSON(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result);
      if(!j.days) throw 0;
      if(confirm("匯入呢個 JSON？會覆蓋本機現有資料。")){
        S=j; S.rate=S.rate||0.052; S.exp=S.exp||[]; S.links=S.links||[]; S.pack=S.pack||[];
        saveNow(); render(); toast("已匯入 JSON ✓"); }
    }catch(e){ toast("JSON 格式唔啱"); } };
    r.readAsText(f); };
  inp.click();
}

/* ---------- 事件委派 ---------- */
function mvArr(arr,i,dir){ const j=i+dir;
  if(j<0||j>=arr.length)return; [arr[i],arr[j]]=[arr[j],arr[i]]; }

view.addEventListener("input",e=>{
  const el=e.target.closest("[data-p]"); if(!el)return;
  let v=el.value;
  if(el.dataset.p==="rate") v=parseFloat(v)||0;
  setPath(el.dataset.p,v); save();
  if(el.dataset.p==="rate"||el.classList.contains("dttl")){} // 即時但唔重畫，免失焦
});
document.getElementById("tripTtl").addEventListener("input",e=>{
  S.title=e.target.value; save();
});

view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const a=b.dataset.act, di=+b.dataset.d, ii=+b.dataset.i;
  if(a==="share")    return shareLink();
  if(a==="exp-json") return expJSON();
  if(a==="imp-json") return impJSON();
  if(a==="itog"){ S.days[di].items[ii].done=!S.days[di].items[ii].done; save(); render(); return; }
  if(a==="ptog"){ S.pack[ii].d=!S.pack[ii].d; save(); render(); return; }
  if(!edit) return;
  if(a==="iadd") S.days[di].items.push({id:uid(),time:"",name:"",kind:"spot",loc:"",info:"",cost:"",cur:"JPY",done:false});
  else if(a==="idel"){ if(confirm("刪除呢個項目？")) S.days[di].items.splice(ii,1); else return; }
  else if(a==="iup") mvArr(S.days[di].items,ii,-1);
  else if(a==="idn") mvArr(S.days[di].items,ii,1);
  else if(a==="dadd") S.days.push({date:"",title:"",items:[]});
  else if(a==="ddel"){ if(confirm("刪除成日連項目？")) S.days.splice(di,1); else return; }
  else if(a==="dup") mvArr(S.days,di,-1);
  else if(a==="ddn") mvArr(S.days,di,1);
  else if(a==="eadd") S.exp.push({id:uid(),date:todayISO(),cat:"",item:"",amount:"",cur:"JPY"});
  else if(a==="edel"){ if(confirm("刪除呢筆開支？")) S.exp.splice(ii,1); else return; }
  else if(a==="ladd") S.links.push({id:uid(),label:"",url:""});
  else if(a==="ldel"){ if(confirm("刪除呢條連結？")) S.links.splice(ii,1); else return; }
  else if(a==="padd") S.pack.push({id:uid(),t:"",d:false});
  else if(a==="pdel"){ if(confirm("刪除呢項？")) S.pack.splice(ii,1); else return; }
  else return;
  save(); render();
});

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  if(b.dataset.tab==="trip") wantScroll=true;
  tab=b.dataset.tab; render();
});
document.getElementById("dstrip").addEventListener("click",e=>{
  const p=e.target.closest(".dpill"); if(!p)return;
  selDay=+p.dataset.day; wantScroll=true; render();
});
view.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(!g)return;
  selDay=+g.dataset.go; wantScroll=true; render();
});
document.getElementById("modeBtn").addEventListener("click",()=>{
  edit=!edit; lsSet(EKEY,edit?"1":"0"); render();
});

/* theme-color 跟系統深/淺 */
function syncTheme(){
  const dark=matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  document.querySelector('meta[name=theme-color]')
    .setAttribute("content",dark?"#0e1117":"#f4f6f8");
}
syncTheme();
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change",syncTheme);

/* ---------- init ---------- */
load();
edit=lsGet(EKEY)==="1";
render();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
