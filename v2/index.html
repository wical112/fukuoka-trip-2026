  .cost{font-size:12px;font-weight:800;color:var(--gold);margin-left:auto;align-self:center}

    background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + var(--sb))}

    font-size:11px;font-weight:800;color:var(--mut);padding:6px 0;background:none}
  .seg button .ic{font-size:19px}
  .seg button.on{color:var(--acc)}

   {id:uid(),t:"雨具（📋 Philips：6/13–20 高機率梅雨期）",d:false},
   {id:uid(),t:"常用藥物",d:false},{id:uid(),t:"網卡 / 漫遊",d:false},
   {id:uid(),t:"📋 約5/17搶 ゆふいんの森 6/17 指定席",d:false},
   {id:uid(),t:"✅ 太宰府本殿已重開（2026-05-17，大改修完）— 無需行前再查",d:true}
  ]
};
let S; try{ const r=lsG(SK); S=r?JSON.parse(r):JSON.parse(JSON.stringify(SEED)); }
catch(e){ S=JSON.parse(JSON.stringify(SEED)); }
if(!S.days){ S=JSON.parse(JSON.stringify(SEED)); }
function save(){ lsS(SK,JSON.stringify(S)); }

const KIND={fly:["fly","✈️"],move:["move","🚆"],food:["food","🍜"],spot:["spot","📍"]};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function wd(ds){return ["日","一","二","三","四","五","六"][new Date(ds+"T00:00:00").getDay()]}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mapA(q){return "https://maps.apple.com/?q="+encodeURIComponent(q)}
function mapG(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}

let sel=0;
function render(){
  document.getElementById("ttl").innerHTML=esc(S.title)+'<span class="v2tag">v2</span>';
  document.getElementById("dates").textContent=S.start+" ～ "+S.end+"（共 "+S.days.length+" 日）";
  const tdy=todayStr();
  const ti=S.days.findIndex(d=>d.date===tdy); if(ti>=0 && sel===0 && !window._touched) sel=ti;
  // day rail
  document.getElementById("drail").innerHTML=S.days.map((d,i)=>{
    const md=d.date.slice(5).replace("-","/");
    return `<button class="dp${i===sel?" on":""}${d.date===tdy?" today":""}" data-d="${i}">
      <div class="n">${md}</div><div class="w">週${wd(d.date)}</div></button>`;
  }).join("");
  renderTrip(); renderExp(); renderPack(); renderLink();
}
function renderTrip(){
  const d=S.days[sel]; if(!d)return;
  const tdy=todayStr();
  let h=`<div class="hero">
    <div class="lbl">${d.date===tdy?"今日行程":"DAY "+(sel+1)+" · "+d.date.replace(/-/g,".")}</div>
    <h2>${esc(d.title)}</h2>
    <div class="sub">${d.date}（週${wd(d.date)}）· ${d.items.length} 個行程點</div>
  </div>`;
  if(sel===0 && S.hotel){
    h+=`<div class="hotel"><span class="i">🏨</span>
      <div class="m">${esc(S.hotel.name)}<small>${esc((S.hotel.stations&&S.hotel.stations[0])||S.hotel.addr)} · ☎ ${esc(S.hotel.tel||"")}</small></div>
      <a class="go" href="${mapA(S.hotel.name+" "+(S.hotel.addr||""))}">導航</a></div>`;
  }
  h+=d.items.map((it,ix)=>{
    const k=KIND[it.kind]||["spot","📍"];
    const tip=/📋|⚠️|👉/.test(it.info||"");
    const q=it.loc||it.name;
    const cost=it.cost?`<span class="cost">¥${Number(it.cost).toLocaleString()}</span>`:"";
    return `<div class="stop${it.done?" done":""}" data-day="${sel}" data-ix="${ix}">
      <div class="srow">
        <div class="kd ${k[0]}">${k[1]}</div>
        <div class="sbody">
          ${it.time?`<div class="stime">${esc(it.time)}</div>`:""}
          <div class="sname">${esc(it.name)}</div>
          ${it.loc?`<div class="sloc">📍 ${esc(it.loc)}</div>`:""}
        </div>
        <div class="chk" data-chk="${ix}" role="button" aria-label="標記完成">✓</div>
      </div>
      ${it.info?`<div class="sinfo${tip?" tip":""}">${esc(it.info)}</div>`:""}
      <div class="acts">
        <a class="pri" href="${mapA(q)}">🧭 Apple 導航</a>
        <a href="${mapG(q)}">Google</a>${cost}
      </div></div>`;
  }).join("");
  document.getElementById("p-trip").innerHTML=h;
}
function renderExp(){
  let jpy=0; S.days.forEach(d=>d.items.forEach(it=>{ if(it.cost) jpy+=Number(it.cost)||0; }));
  (S.exp||[]).forEach(e=>jpy+=Number(e.amt)||0);
  const hkd=Math.round(jpy*(S.rate||0.052));
  document.getElementById("p-exp").innerHTML=
    `<div class="sum"><div class="big">¥${jpy.toLocaleString()}</div>
      <div class="sm">≈ HK$${hkd.toLocaleString()} （匯率 ${S.rate||0.052}）· 行程內已標金額自動小計</div></div>`+
    S.days.flatMap(d=>d.items.filter(it=>it.cost).map(it=>
      `<div class="li"><span style="flex:1">${esc(it.name)}<br><small style="color:var(--mut)">${d.date}</small></span>
       <b style="color:var(--gold)">¥${Number(it.cost).toLocaleString()}</b></div>`)).join("")
    || (jpy?"":'<div class="li" style="justify-content:center;color:var(--mut)">行程未標金額</div>');
}
function renderPack(){
  document.getElementById("p-pack").innerHTML=(S.pack||[]).map((p,i)=>
    `<div class="li${p.d?" dn":""}" data-pk="${i}"><span style="flex:1">${esc(p.t)}</span>
      <div class="chk" style="${p.d?"background:var(--acc);border-color:var(--acc);color:#fff":""}">✓</div></div>`).join("");
}
function renderLink(){
  document.getElementById("p-link").innerHTML=(S.links||[]).map(l=>
    `<div class="li"><a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label)}</a></div>`).join("");
}

document.addEventListener("click",e=>{
  const dp=e.target.closest("[data-d]");
  if(dp){ window._touched=1; sel=+dp.dataset.d; render();
    document.getElementById("p-trip").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const ck=e.target.closest("[data-chk]");
  if(ck){ const st=ck.closest(".stop"); const dy=+st.dataset.day, ix=+st.dataset.ix;
    S.days[dy].items[ix].done=!S.days[dy].items[ix].done; save(); render(); return; }
  const pk=e.target.closest("[data-pk]");
  if(pk){ const i=+pk.dataset.pk; S.pack[i].d=!S.pack[i].d; save(); renderPack(); return; }
  const sg=e.target.closest("#seg button");
  if(sg){ const p=sg.dataset.p;
    document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===sg));
    document.querySelectorAll(".panel").forEach(s=>s.classList.toggle("on",s.id==="p-"+p));
    scrollTo({top:0,behavior:"smooth"}); return; }
});
render();
</script>
</body>
</html>
